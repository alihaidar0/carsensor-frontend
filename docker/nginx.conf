# ============================================================
#  nginx.conf — React SPA Configuration
#
#  The critical rule is try_files $uri $uri/ /index.html
#  Without it, refreshing /dashboard returns 404 because
#  Nginx looks for a real file called "dashboard" on disk.
#  React Router handles all routing — Nginx just serves index.html.
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Cache static assets (Vite adds content hashes) ────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html — never cache ──────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── SPA fallback — all routes → index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check ─────────────────────────────────────────
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }
}
